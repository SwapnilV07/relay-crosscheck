name: relay-watch
# Every Monday, compare this project with what Relay has published (changelog, fail reasons)
# and open an issue for anything new. Run it by hand from the Actions tab at any time.
on:
  schedule:
    - cron: "17 3 * * 1"   # Mondays 03:17 UTC (08:47 IST)
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/watch-relay.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
